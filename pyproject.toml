[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reposquad_ml_collab"
version = "0.0.1"
description = "Git-based collaborative machine learning project using DVC and GitHub Actions"
authors = [
  { name = "Fatima Tu Zahra and Fatima Anjum" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "dvc>=3.67.1",
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "pandas",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = "~=3.12.0"


[tool.ruff]
line-length = 99
src = ["reposquad_ml_collab"]
include = ["pyproject.toml", "reposquad_ml_collab/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["reposquad_ml_collab"]
force-sort-within-sections = true

